name: Publish local Players
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v1.2.3 or v1.2.3-alpha.1)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      # Use trusted main publisher, never execute code supplied in a package.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and download staged local builds
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0,"tools/release"); from release import tag_ok; import os; tag_ok(os.environ["RELEASE_TAG"])'
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          mkdir -p Builds/Staged
          gh release download "local-builds-$RELEASE_TAG" --dir Builds/Staged --pattern manifest.json --pattern '*.zip'
      - name: Validate complete packages against the tag
        run: python3 tools/release/release.py validate Builds/Staged "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Create draft, upload validated assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Locally compiled Unity Players. See manifest.json for commit and SHA256SUMS for integrity. See source tag README for credits and known limitations."
          fi
          python3 tools/release/publish.py Builds/Staged "$RELEASE_TAG" "$RELEASE_COMMIT"
