name: Repository and release tooling checks
on:
  push:
    branches: [main, feat/navigation-branded-intro-release, feat/local-build-releases]
  pull_request:
    branches: [main, feat/navigation-branded-intro-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/verify-navigation.py
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
