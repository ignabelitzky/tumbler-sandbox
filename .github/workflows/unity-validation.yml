name: Project checks
on:
  push:
    branches: [main, feat/navigation-branded-intro-release]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    name: Asset, intro and pause checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/organic-sandbox/check.py
      - run: python3 tools/verify-navigation.py
      - run: python3 tools/sandbox-expansion/check.py
